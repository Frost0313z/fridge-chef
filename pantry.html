<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 냉장고 · 냉털 셰프</title>
  <meta name="description" content="냉장고에 있는 재료를 등록해두면 레시피 추천·식단 계획·장보기에 자동으로 반영됩니다." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- 공유 카드. og:image는 절대 URL이어야 하고, SVG를 받지 않는 곳이 있어 PNG를 쓴다.
       원본은 assets/og.html — 문구가 바뀌면 그 페이지를 1200x630으로 다시 구우면 된다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="있는대로" />
  <meta property="og:url" content="https://fridge-chef-gamma.vercel.app/pantry.html" />
  <meta property="og:title" content="있는대로 — 오늘 뭐 해먹지?" />
  <meta property="og:description" content="애매하게 남은 재료로도 한 끼는 나와요. 있는 재료만 적으면 요리와 장보기 리스트를 만들어드려요." />
  <meta property="og:image" content="https://fridge-chef-gamma.vercel.app/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main" class="skip-link">본문 바로가기</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand" aria-label="있는대로 홈으로">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true" focusable="false">
          <rect x="5" y="2" width="16" height="22" rx="3.5" />
          <path d="M5 10.5h16" />
          <path d="M9 6v2.5M9 13.5v3" />
        </svg>
        <span class="brand-name">있는대로</span>
      </a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html">홈</a>
        <a href="pantry.html" class="active">냉장고</a>
        <a href="recipe.html">레시피 추천</a>
        <a href="mealplan.html">식단 계획</a>
        <a href="shopping.html">장보기</a>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <section class="page-intro">
      <h1>내 냉장고</h1>
      <p>여기에 등록한 재료는 이 브라우저에 저장되어, 레시피 추천·식단 계획·장보기에 자동으로 반영돼요.</p>
    </section>

    <section class="pantry-page">
      <h2>🥕 재료 넣기</h2>
      <p class="pantry-hint">쉼표로 구분하면 여러 개를 한 번에 넣을 수 있어요. <strong>"계란 2개"처럼 수량을 함께 적으면</strong> 식단을 짤 때 모자란 재료를 더 정확히 골라드려요.</p>
      <div class="pantry-input-row">
        <input type="text" id="pantry-input" placeholder="재료와 수량 입력 후 Enter (쉼표로 여러 개, 예: 계란 2개, 두부 1모, 김치 조금)" />
        <button type="button" id="pantry-add-btn">넣기</button>
      </div>
      <p id="pantry-status" class="pantry-status" role="status" aria-live="polite" hidden></p>

      <div class="pantry-list-head">
        <h2 class="pantry-list-title">지금 들어있는 재료</h2>
        <button type="button" id="pantry-amount-toggle" class="pill-toggle pantry-amount-toggle" aria-pressed="false">
          자세히
        </button>
      </div>
      <div id="pantry-chips" class="pantry-chips"></div>
      <div id="pantry-limit-note" hidden></div>
      <div id="pantry-empty" class="pantry-empty">
        <p>아직 등록된 재료가 없어요. 자주 쓰는 재료부터 넣어보세요.</p>
        <p class="pantry-example-label">눌러서 바로 넣기</p>
        <div class="pantry-examples">
          <button type="button" class="pantry-example" data-name="계란">계란</button>
          <button type="button" class="pantry-example" data-name="대파">대파</button>
          <button type="button" class="pantry-example" data-name="두부">두부</button>
          <button type="button" class="pantry-example" data-name="김치">김치</button>
          <button type="button" class="pantry-example" data-name="양파">양파</button>
        </div>
      </div>
    </section>

    <section class="page-next">
      <p>재료를 다 넣었다면</p>
      <div class="hero-actions">
        <a href="recipe.html" class="cta-button">이 재료로 추천받기 →</a>
        <a href="mealplan.html" class="cta-button cta-button-secondary">이번 주 식단 짜기</a>
      </div>
    </section>
  </main>


  <script src="js/main.js"></script>
  <script src="js/shared.js"></script>
</body>
</html>

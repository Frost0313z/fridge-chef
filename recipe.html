<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레시피 추천 · 냉털 셰프</title>
  <meta name="description" content="냉장고 속 재료를 입력하면 AI가 오늘 만들 수 있는 요리를 추천해드립니다." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand">🧊 냉털 셰프</a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html">홈</a>
        <a href="recipe.html" class="active">레시피 추천</a>
        <a href="about.html">소개</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-intro">
      <h1>냉장고에 뭐가 있나요?</h1>
      <p>있는 재료를 쉼표로 구분해서 입력해주세요. 정확한 계량은 몰라도 괜찮아요.</p>
    </section>

    <section class="recipe-form-section">
      <form id="recipe-form" novalidate>
        <label for="ingredients">보유 재료 <span class="required">*</span></label>
        <textarea
          id="ingredients"
          name="ingredients"
          rows="3"
          placeholder="예: 계란 2개, 대파 조금, 두부 반모"
          required
        ></textarea>

        <div class="form-row">
          <div class="form-field">
            <label for="headcount">인원수</label>
            <select id="headcount" name="headcount">
              <option value="1인분">1인분</option>
              <option value="2인분">2인분</option>
              <option value="3~4인분">3~4인분</option>
            </select>
          </div>
          <div class="form-field">
            <label for="timeLimit">희망 조리 시간</label>
            <select id="timeLimit" name="timeLimit">
              <option value="상관없음">상관없음</option>
              <option value="15분 이내">15분 이내</option>
              <option value="30분 이내">30분 이내</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="cta-button">AI에게 추천받기</button>
      </form>

      <p id="loading" class="loading" hidden>🍳 재료를 살펴보고 요리를 고민하고 있어요...</p>
      <p id="error" class="error-message" role="alert" hidden></p>

      <div id="result" class="result-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>🧊 냉털 셰프 · Codyssey 대전 "AI 웹 개발" 미션 결과물</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/recipe.js"></script>
</body>
</html>

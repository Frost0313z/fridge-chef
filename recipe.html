<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레시피 추천 · 있는대로</title>
  <meta name="description" content="냉장고 속 재료를 입력하면 AI가 오늘 만들 수 있는 요리를 추천해드립니다." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- 공유 카드. og:image는 절대 URL이어야 하고, SVG를 받지 않는 곳이 있어 PNG를 쓴다.
       원본은 assets/og.html — 문구가 바뀌면 그 페이지를 1200x630으로 다시 구우면 된다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="있는대로" />
  <meta property="og:url" content="https://fridge-chef-gamma.vercel.app/recipe.html" />
  <meta property="og:title" content="있는대로 — 오늘 뭐 해먹지?" />
  <meta property="og:description" content="애매하게 남은 재료로도 한 끼는 나와요. 있는 재료만 적으면 요리와 장보기 리스트를 만들어드려요." />
  <meta property="og:image" content="https://fridge-chef-gamma.vercel.app/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main" class="skip-link">본문 바로가기</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand" aria-label="있는대로 홈으로">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true" focusable="false">
          <rect x="5" y="2" width="16" height="22" rx="3.5" />
          <path d="M5 10.5h16" />
          <path d="M9 6v2.5M9 13.5v3" />
        </svg>
        <span class="brand-name">있는대로</span>
      </a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html">홈</a>
        <a href="pantry.html">냉장고</a>
        <a href="recipe.html" class="active">레시피 추천</a>
        <a href="mealplan.html">식단 계획</a>
        <a href="shopping.html">장보기</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page">
    <section class="page-intro">
      <h1>오늘 뭐 해먹을까요?</h1>
      <p>냉장고에 있는 재료는 자동으로 반영돼요. 오늘만 있는 재료가 있다면 아래에 따로 적어주세요.</p>
    </section>

    <section class="recipe-form-section">
      <form id="recipe-form" novalidate>
        <label for="ingredients">오늘 추가로 있는 재료 <span class="optional">(선택)</span></label>
        <textarea
          id="ingredients"
          name="ingredients"
          rows="2"
          placeholder="냉장고에 없는 재료가 있다면 여기에 추가로 적어주세요. 예: 대파 조금, 두부 반모"
        ></textarea>

        <div class="form-row">
          <div class="form-field">
            <label for="portion">만들 분량</label>
            <select id="portion" name="portion">
              <option value="한 끼">한 끼</option>
              <option value="두 끼">두 끼 (내일 점심까지)</option>
              <option value="3~4끼">3~4끼 (며칠치)</option>
            </select>
          </div>
          <div class="form-field">
            <label for="timeLimit">희망 조리 시간</label>
            <select id="timeLimit" name="timeLimit">
              <option value="상관없음">상관없음</option>
              <option value="15분 이내">15분 이내</option>
              <option value="30분 이내">30분 이내</option>
            </select>
          </div>
        </div>

        <label class="form-check">
          <input type="checkbox" id="healthy" name="healthy" />
          건강 관리 중이에요 (기름지지 않고 칼로리 낮은 요리로)
        </label>

        <button type="submit" id="submit-btn" class="cta-button">AI에게 추천받기</button>
      </form>

      <p id="loading" class="loading" role="status" aria-live="polite" hidden>🍳 재료를 살펴보고 요리를 고민하고 있어요...</p>
      <p id="error" class="error-message" role="alert" hidden></p>
      <p id="error-fallback" class="error-fallback" hidden>
        지금 추천을 못 받아도 괜찮아요.
        <button type="button" id="error-history-btn" class="link-button">최근 추천 받은 요리 보기</button>
      </p>

      <p id="result-empty" class="result-empty">아직 추천받은 요리가 없어요. 재료를 확인하고 위 버튼을 눌러보세요.</p>
      <div id="result" class="result-grid" aria-live="polite"></div>

      <button type="button" id="rerecommend-btn" class="cta-button cta-button-secondary rerecommend-btn" hidden>
        다른 요리 추천받기
      </button>
    </section>

    <section class="history">
      <div class="history-header">
        <h2>🕘 최근 추천 받은 요리</h2>
        <button type="button" id="history-clear-btn" class="link-button link-button-muted">전체 지우기</button>
      </div>
      <p id="history-empty" class="history-empty">아직 추천받은 요리가 없어요.</p>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>


  <details id="pantry-bar" class="pantry-bar">
    <summary>
      <span class="pantry-bar-head">
        <span class="pantry-bar-title">🥕 냉장고</span>
        <span id="pantry-bar-summary" class="pantry-bar-summary"></span>
      </span>
    </summary>
    <div id="pantry-bar-body" class="pantry-bar-body"></div>
  </details>

  <script src="js/main.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/recipe.js"></script>
</body>
</html>

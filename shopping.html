<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장보기 · 있는대로</title>
  <meta name="description" content="식단에 필요한 양에서 냉장고에 있는 만큼을 뺀 부족분만 골라 장보기 리스트로 보여드립니다. 각 줄이 왜 나왔는지 근거도 함께 확인할 수 있습니다." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- 공유 카드. og:image는 절대 URL이어야 하고, SVG를 받지 않는 곳이 있어 PNG를 쓴다.
       원본은 assets/og.html — 문구가 바뀌면 그 페이지를 1200x630으로 다시 구우면 된다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="있는대로" />
  <meta property="og:url" content="https://fridge-chef-gamma.vercel.app/shopping.html" />
  <meta property="og:title" content="있는대로 — 오늘 뭐 해먹지?" />
  <meta property="og:description" content="애매하게 남은 재료로도 한 끼는 나와요. 있는 재료만 적으면 요리와 장보기 리스트를 만들어드려요." />
  <meta property="og:image" content="https://fridge-chef-gamma.vercel.app/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="shopping">
  <a href="#main" class="skip-link">본문 바로가기</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand" aria-label="있는대로 홈으로">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true" focusable="false">
          <rect x="5" y="2" width="16" height="22" rx="3.5" />
          <path d="M5 10.5h16" />
          <path d="M9 6v2.5M9 13.5v3" />
        </svg>
        <span class="brand-name">있는대로</span>
      </a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html">홈</a>
        <a href="pantry.html">냉장고</a>
        <a href="recipe.html">레시피 추천</a>
        <a href="mealplan.html">식단 계획</a>
        <a href="shopping.html" class="active">장보기</a>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <section class="page-intro">
      <h1 data-copy="UI.shoppingTitle">뭘 사야 할까요?</h1>
      <p data-copy="UI.shoppingIntro">식단에 필요한 양에서 냉장고에 있는 만큼을 뺀 부족한 만큼만 모았어요. 사고 나면 "샀어요"를 눌러 냉장고에 넣어주세요.</p>
    </section>

    <section class="shopping-page">
      <p id="shopping-empty" class="shopping-empty" data-copy="UI.emptyShopping" hidden>아직 식단이 없어요. 식단을 먼저 짜면 살 것만 골라드릴게요.</p>
      <p id="shopping-empty-cta" class="page-next-inline" hidden>
        <a href="mealplan.html" class="cta-button" data-copy="UI.shoppingEmptyCta">식단 짜러 가기 →</a>
      </p>

      <div id="shopping-result" hidden>
        <h2 data-copy="UI.shoppingListTitle">이것만 사면 돼요</h2>
        <p id="shopping-stale" class="shopping-stale" role="status" hidden>
          <span data-copy="UI.shoppingStale">식단을 고쳐서 이 목록이 지금 계획과 다를 수 있어요.</span>
          <button type="button" id="shopping-refresh-btn" class="link-button" data-copy="UI.shoppingRefresh">장보기 다시 뽑기</button>
        </p>
        <p id="shopping-refresh-loading" class="loading" role="status" data-copy="UI.loadingShopping" hidden>바뀐 식단으로 다시 계산하고 있어요…</p>
        <p id="shopping-refresh-error" class="error-message" role="alert" hidden></p>
        <p id="shopping-list-hint" class="shopping-list-hint" data-copy="UI.shoppingHint">자동으로 담기지는 않아요. 누르면 쿠팡 검색 결과가 새 탭에서 열려요.</p>
        <ul id="shopping-list" class="shopping-list" aria-live="polite"></ul>
        <p id="shopping-status" class="shopping-status" role="status" hidden></p>
      </div>
    </section>
  </main>


  <details id="pantry-bar" class="pantry-bar">
    <summary>
      <span class="pantry-bar-head">
        <span class="pantry-bar-title">🥕 냉장고</span>
        <span id="pantry-bar-summary" class="pantry-bar-summary"></span>
      </span>
    </summary>
    <div id="pantry-bar-body" class="pantry-bar-body"></div>
  </details>

  <script src="js/copy.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/shopping.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="26" height="26">
  <!-- 있는대로 심벌 — 냉장고 문. 헤더 워드마크(.brand-mark)와 같은 도형이다.
       파비콘은 currentColor를 상속받을 부모가 없으므로 브랜드 그린을 직접 지정하고,
       다크 테마 탭에서 묻히지 않도록 밝은 톤으로 바꾼다(tokens.css의 --brand 값과 같다). -->
  <style>
    svg { color: #3F7A5A }
    @media (prefers-color-scheme: dark) { svg { color: #6FB58C } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <!-- 16px로 줄었을 때 획이 뭉치지 않도록 헤더 마크보다 여백을 조금 덜어냈다 -->
    <rect x="4" y="1.5" width="18" height="23" rx="4" />
    <path d="M4 10.5h18" />
    <path d="M8.5 5.5v2.5M8.5 13.5v3" />
  </g>
</svg>

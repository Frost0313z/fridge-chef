<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주간 식단 계획 · 냉털 셰프</title>
  <meta name="description" content="냉장고를 활용해 일주일 저녁 식단을 계획하고, 부족한 재료만 장보기 리스트로 확인하세요." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main" class="skip-link">본문 바로가기</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand">🧊 냉털 셰프</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환">🌙</button>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html">홈</a>
        <a href="pantry.html">냉장고</a>
        <a href="recipe.html">레시피 추천</a>
        <a href="mealplan.html" class="active">식단 계획</a>
        <a href="shopping.html">장보기</a>
      </nav>
    </div>
  </header>

  <details id="pantry-bar" class="pantry-bar">
    <summary>
      <span class="pantry-bar-title">🥕 냉장고</span>
      <span id="pantry-bar-summary" class="pantry-bar-summary"></span>
    </summary>
    <div id="pantry-bar-body" class="pantry-bar-body"></div>
  </details>

  <main id="main" class="page">
    <section class="page-intro">
      <h1>이번 주 저녁, 미리 정해둘까요?</h1>
      <p>냉장고에 있는 재료를 최대한 활용해서 며칠치 식단을 짜드려요. 부족한 재료는 장보기에서 확인할 수 있어요.</p>
    </section>

    <section class="recipe-form-section">
      <form id="mealplan-form" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="days">계획할 일수</label>
            <select id="days" name="days">
              <option value="3">3일</option>
              <option value="5" selected>5일</option>
              <option value="7">7일</option>
            </select>
          </div>
          <div class="form-field">
            <label for="mp-portion">한 끼당 만들 분량</label>
            <select id="mp-portion" name="portion">
              <option value="한 끼">한 끼</option>
              <option value="두 끼">두 끼 (다음 끼니까지)</option>
              <option value="3~4끼">3~4끼 (며칠치)</option>
            </select>
          </div>
        </div>

        <label class="form-check">
          <input type="checkbox" id="mp-healthy" name="healthy" />
          건강 관리 중이에요 (기름지지 않고 칼로리 낮은 요리로)
        </label>

        <button type="submit" id="mealplan-submit-btn" class="cta-button">AI로 식단 만들기</button>
        <button type="button" id="mealplan-clear-btn" class="link-button link-button-muted mealplan-clear-btn" hidden>계획 지우기</button>
      </form>

      <p id="mealplan-loading" class="loading" role="status" aria-live="polite" hidden>🗓️ 일주일치 식단을 짜고 있어요...</p>
      <p id="mealplan-error" class="error-message" role="alert" hidden></p>

      <p id="mealplan-empty" class="result-empty">아직 계획이 없어요. 위에서 며칠치 세 끼를 계획해보세요.</p>

      <div id="mealplan-toolbar" class="mealplan-toolbar" hidden>
        <h2 class="mealplan-toolbar-title">🗓️ 이번 주 식단</h2>
        <button type="button" id="mealplan-edit-btn" class="pill-toggle mealplan-edit-btn" aria-pressed="false">메뉴 바꾸기</button>
      </div>
      <p id="mealplan-edit-status" class="mealplan-edit-status" role="status" hidden></p>

      <div id="mealplan-result" aria-live="polite"></div>

      <p id="mealplan-next" class="mealplan-next" hidden>
        부족한 재료는 <a href="shopping.html">장보기 리스트에서 확인 →</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>🧊 냉털 셰프 · Codyssey 대전 "AI 웹 개발" 미션 결과물</p>
    <div class="footer-credit">
      <a href="https://www.linkedin.com/in/%EC%8A%B9%ED%98%84-%EB%91%90-b6a319270/" target="_blank" rel="noopener noreferrer">💼 두승현</a>
      <a href="mailto:msong5000@naver.com">✉️ msong5000@naver.com</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/mealplan.js"></script>
</body>
</html>

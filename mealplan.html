<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주간 식단 계획 · 있는대로</title>
  <meta name="description" content="냉장고에 있는 대로 며칠치 저녁을 미리 정하고, 부족한 재료만 따로 모아드려요." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- 공유 카드. og:image는 절대 URL이어야 하고, SVG를 받지 않는 곳이 있어 PNG를 쓴다.
       원본은 assets/og.html — 문구가 바뀌면 그 페이지를 1200x630으로 다시 구우면 된다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="있는대로" />
  <meta property="og:url" content="https://fridge-chef-gamma.vercel.app/mealplan.html" />
  <meta property="og:title" content="있는대로 — 오늘 뭐 해먹지?" />
  <meta property="og:description" content="애매하게 남은 재료로도 한 끼는 나와요. 있는 재료만 적으면 요리와 장보기 리스트를 만들어드려요." />
  <meta property="og:image" content="https://fridge-chef-gamma.vercel.app/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="mealplan">
  <a href="#main" class="skip-link" data-copy="NAV.skip">본문 바로가기</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="brand" data-copy="NAV.brandAria" data-copy-attr="aria-label" aria-label="있는대로 홈으로">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          aria-hidden="true" focusable="false">
          <rect x="5" y="2" width="16" height="22" rx="3.5" />
          <path d="M5 10.5h16" />
          <path d="M9 6v2.5M9 13.5v3" />
        </svg>
        <span class="brand-name" data-copy="BRAND.name">있는대로</span>
      </a>
      <button id="nav-toggle" class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" data-copy="NAV.menuAria" data-copy-attr="aria-label" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="index.html" data-copy="NAV.home">홈</a>
        <a href="pantry.html" data-copy="NAV.pantry">냉장고</a>
        <a href="recipe.html" data-copy="NAV.recipe">레시피 추천</a>
        <a href="mealplan.html" class="active" data-copy="NAV.mealplan">식단 계획</a>
        <a href="shopping.html" data-copy="NAV.shopping">장보기</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page">
    <section class="page-intro">
      <h1 data-copy="UI.mealplanTitle">이번 주 저녁, 미리 정해둘까요?</h1>
      <p data-copy="UI.mealplanIntro">냉장고에 있는 재료를 최대한 쓰고, 부족한 것만 장보기로 모아드려요.</p>
    </section>

    <section class="recipe-form-section">
      <form id="mealplan-form" novalidate>
        <!-- <option>은 보이는 글자만 COPY에서 받는다. value는 그대로 서버 프롬프트로
             나가므로 건드리지 않는다 — 바꾸면 AI가 받는 지시가 달라진다. -->
        <div class="form-row">
          <div class="form-field">
            <label for="days" data-copy="FORM.days">계획할 일수</label>
            <select id="days" name="days">
              <option value="3" data-copy="FORM.days3">3일</option>
              <option value="5" selected data-copy="FORM.days5">5일</option>
              <option value="7" data-copy="FORM.days7">7일</option>
            </select>
          </div>
          <div class="form-field">
            <label for="mp-portion" data-copy="FORM.portionPerMeal">한 끼당 만들 분량</label>
            <select id="mp-portion" name="portion">
              <option value="한 끼" data-copy="FORM.portionOne">한 끼</option>
              <option value="두 끼" data-copy="FORM.portionTwoMealplan">두 끼 (다음 끼니까지)</option>
              <option value="3~4끼" data-copy="FORM.portionFew">3~4끼 (며칠치)</option>
            </select>
          </div>
        </div>

        <!-- 문구를 <span>으로 감싼다. <label>에 직접 걸면 textContent를 덮어쓰면서
             안에 있는 <input type="checkbox">가 통째로 지워진다. -->
        <label class="form-check">
          <input type="checkbox" id="mp-healthy" name="healthy" />
          <span data-copy="FORM.healthy">건강 관리 중이에요 (기름지지 않고 칼로리 낮은 요리로)</span>
        </label>

        <button type="submit" id="mealplan-submit-btn" class="cta-button" data-copy="UI.submitMealplan">식단 짜기</button>
        <button type="button" id="mealplan-clear-btn" class="link-button link-button-muted mealplan-clear-btn" data-copy="UI.clearPlan" hidden>계획 지우기</button>
      </form>

      <p id="mealplan-loading" class="loading" role="status" aria-live="polite" data-copy="UI.loadingMealplan" hidden>며칠치 저녁을 짜고 있어요…</p>
      <p id="mealplan-error" class="error-message" role="alert" hidden></p>

      <p id="mealplan-empty" class="result-empty" data-copy="UI.emptyMealplan">아직 짜둔 식단이 없어요. 위에서 며칠치 저녁을 정해보세요.</p>

      <div id="mealplan-toolbar" class="mealplan-toolbar" hidden>
        <h2 class="mealplan-toolbar-title" data-copy="UI.mealPlanTitle">이번 주 식단</h2>
        <button type="button" id="mealplan-edit-btn" class="pill-toggle mealplan-edit-btn" aria-pressed="false" data-copy="UI.editMenu">메뉴 바꾸기</button>
      </div>
      <p id="mealplan-edit-status" class="mealplan-edit-status" role="status" hidden></p>
      <p id="mealplan-stale" class="mealplan-stale" data-copy="UI.mealplanStale" hidden>계획한 날짜가 모두 지났어요. 새로 짜면 오늘부터 다시 정해드려요.</p>

      <div id="mealplan-result" aria-live="polite"></div>

      <p id="mealplan-next" class="mealplan-next" hidden>
        <span data-copy="UI.mealplanNext">부족한 재료는</span> <a href="shopping.html" data-copy="UI.mealplanNextLink">장보기에서 확인 →</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p data-copy="FOOTER.line">냉장고에 있는 대로, 오늘 한끼 완성 · © 2026 있는대로</p>
    <div class="footer-credit">
      <a href="https://www.linkedin.com/in/seunghyeondu/" target="_blank" rel="noopener noreferrer"
        data-copy="FOOTER.linkedinLabel" data-copy-href="FOOTER.linkedinUrl"
        data-copy-attr="aria-label:FOOTER.linkedinAriaLabel"
        aria-label="두승현의 LinkedIn 프로필로 이동">두승현</a>
    </div>
  </footer>

  <details id="pantry-bar" class="pantry-bar">
    <summary>
      <span class="pantry-bar-head">
        <span class="pantry-bar-title" data-copy="PANTRY.title">냉장고</span>
        <span id="pantry-bar-summary" class="pantry-bar-summary"></span>
      </span>
    </summary>
    <div id="pantry-bar-body" class="pantry-bar-body"></div>
  </details>

  <script src="js/copy.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/mealplan.js"></script>
</body>
</html>
